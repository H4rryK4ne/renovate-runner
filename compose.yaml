services:
  renovate:
    image: renovate/renovate:44.33.1
    init: true
    restart: "no"
    env_file:
      - renovate.env
    environment:
      RENOVATE_CONFIG_FILE: /usr/src/app/config.js
      RENOVATE_BASE_DIR: /tmp/renovate
      RENOVATE_CACHE_DIR: /tmp/renovate/cache
    volumes:
      - ./config.js:/usr/src/app/config.js:ro
      - ./cache:/tmp/renovate/cache

